name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_task:
        description: 'Gradle build task(s) to execute'
        required: true
        default: 'assembleNonRootDebug assembleNonRootRelease'
        type: string

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;29.0.14206865" || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew ${{ inputs.build_task || 'assembleNonRootDebug assembleNonRootRelease' }} --stacktrace

      - name: Upload APKs to Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-android-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error