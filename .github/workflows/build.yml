name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      build_task:
        description: 'Gradle build task(s) to execute'
        required: true
        default: 'assembleNonRootDebug assembleNonRootRelease'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/29.0.14206865
          key: ndk-29.0.14206865

      - name: Accept Android SDK licenses & Install NDK
        run: |
          yes | sdkmanager --licenses || true
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            sdkmanager --install "ndk;29.0.14206865" || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew ${{ inputs.build_task || 'assembleNonRootDebug assembleNonRootRelease' }} --build-cache --stacktrace

      - name: Upload APKs to Artifact Storage
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-android-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error